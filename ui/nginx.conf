# Serves the test UI and proxies the API on the same origin, so the API needs no CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /audit/ {
        proxy_pass http://aip:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /openapi.json { proxy_pass http://aip:8000; }
    location /docs { proxy_pass http://aip:8000; }
}
